<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects — Adriel</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#FBFAF7; --fg:#121212; --line:#121212;
    --head:#F7E74F; --on-head:#121212;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif; --maxw:1040px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#0E0E10; --fg:#ECEAE4; --line:#ECEAE4; color-scheme:dark; }}
  :root[data-theme="dark"]{ --bg:#0E0E10; --fg:#ECEAE4; --line:#ECEAE4; color-scheme:dark; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--fg); font-family:var(--sans); min-height:100%; }
  img{ max-width:100%; }
  a{ color:inherit; }

  .hero{ background:var(--head); color:var(--on-head); width:100%; }
  .hero__in{ max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:clamp(16px,4vw,40px);
    padding-block:clamp(38px,9vw,82px); padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }
  .hero__title{ font-size:clamp(38px,9vw,82px); font-weight:800; letter-spacing:-.03em; line-height:.95; overflow-wrap:anywhere; }
  .hero__logo{ width:clamp(110px,22vw,210px); height:auto; flex-shrink:0; display:block; }

  .bar{ border-bottom:1px solid var(--line); }
  .bar__in{ max-width:var(--maxw); margin:0 auto; display:flex; gap:clamp(16px,4vw,30px); flex-wrap:wrap; padding-block:14px;
    padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }
  .bar a{ font-size:14px; font-weight:600; text-decoration:none; position:relative; padding:2px 0; }
  .bar a::after{ content:""; position:absolute; left:0; right:100%; bottom:0; height:1.5px; background:var(--fg); transition:right .16s ease; }
  .bar a:hover::after, .bar a:focus-visible::after, .bar a[aria-current]::after{ right:0; }
  .bar a[aria-current]{ font-weight:800; }
  .bar a:focus-visible{ outline:none; }

  .wrap{ max-width:var(--maxw); margin:0 auto; padding-block:clamp(34px,6vw,60px);
    padding-left:max(24px,env(safe-area-inset-left,0px)); padding-right:max(24px,env(safe-area-inset-right,0px)); }

  /* listing grid + cards */
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:clamp(28px,4vw,44px); }
  .item{ display:flex; flex-direction:column; align-items:flex-start; gap:10px; min-width:0; text-decoration:none; color:inherit; }
  .item__image{ display:block; width:100%; aspect-ratio:16/10; object-fit:cover; border:1px solid var(--line); background:var(--head); }
  .item--empty{ border:1.5px dashed var(--line); padding:clamp(18px,3vw,24px); opacity:.72; transition:opacity .15s ease; }
  .item--empty:hover, .item--empty:focus-visible{ opacity:1; outline:none; }
  .item__year{ font-size:13px; font-weight:700; }
  .item__title{ font-size:clamp(18px,2.4vw,22px); font-weight:700; line-height:1.15; letter-spacing:-.01em; }
  .item__desc{ font-size:15px; font-weight:400; line-height:1.5; }
  .tags{ display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
  .tag{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line); padding:5px 11px; line-height:1; }

  /* prose (about + detail pages) */
  .doc{ max-width:680px; display:flex; flex-direction:column; gap:22px; }
  .doc p{ font-size:clamp(16px,2.1vw,18px); line-height:1.6; font-weight:400; }
  .doc a{ font-weight:600; text-decoration:underline; text-underline-offset:3px; }
  .doc__quote{ border-left:3px solid var(--head); padding-left:20px; font-size:clamp(18px,2.4vw,21px); line-height:1.45; font-weight:500; }
  .doc__quote cite{ display:block; margin-top:12px; font-size:15px; font-weight:600; font-style:normal; }
  .doc__meta{ font-size:14px; font-weight:600; opacity:.85; }
  .back{ margin-bottom:26px; }
  .back a{ font-size:14px; font-weight:700; text-decoration:none; }
  .back a:hover{ text-decoration:underline; text-underline-offset:3px; }

  .theme{ position:fixed; top:env(safe-area-inset-top,0px); right:0; margin:12px; margin-right:max(12px,env(safe-area-inset-right,0px));
    width:34px; height:34px; border-radius:50%; border:1px solid currentColor; background:transparent; color:var(--on-head);
    opacity:.6; cursor:pointer; font-size:14px; line-height:1; display:grid; place-items:center; transition:opacity .15s ease; z-index:5; }
  .theme:hover{ opacity:1; }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>

  </div>
</main>

<script>
  (function(){
    var root=document.documentElement, btn=document.getElementById('theme');
    var saved; try{ saved=localStorage.getItem('adriel-theme'); }catch(e){}
    if(saved){ root.setAttribute('data-theme',saved); }
    btn.addEventListener('click',function(){
      var cur=root.getAttribute('data-theme');
      var isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
      var next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme',next);
      try{ localStorage.setItem('adriel-theme',next); }catch(e){}
    });
  })();
</script>
</body>
