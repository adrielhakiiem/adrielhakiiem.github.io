<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0;padding:0}*{box-sizing:border-box}img{max-width:100%}</style>
<title>Adriel — Card</title>
<style>
  /* Layout: a single flip card on a toggled ground. Front = royal-blue + white logo;
     click to flip to the Swiss back (contacts + page nav). All back text black, Helvetica. */
  :root{
    --ground:#E7E4DC; --ground-fg:#17150F;
    --ar:1.4/1; --cardw:min(92vw,440px);
    --royal:#2A398E; --royal-ink:#F3F5FF;
    --paper:#F6F5F1; --ink:#111111;
    --sans:'Helvetica Neue',Helvetica,Arial,sans-serif;
    --shadow:0 1px 0 rgba(0,0,0,.04), 0 18px 40px -24px rgba(0,0,0,.4);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ground:#0A0A0B; --ground-fg:#EDEBE6;
    --shadow:0 0 0 1px rgba(255,255,255,.05), 0 26px 60px -30px rgba(0,0,0,.85);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --ground:#0A0A0B; --ground-fg:#EDEBE6;
    --shadow:0 0 0 1px rgba(255,255,255,.05), 0 26px 60px -30px rgba(0,0,0,.85);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{ background:var(--ground); color:var(--ground-fg); font-family:var(--sans); min-height:100%; }

  .stage{
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding-block:clamp(34px,8vh,74px);
    padding-left:max(16px,env(safe-area-inset-left,0px));
    padding-right:max(16px,env(safe-area-inset-right,0px));
  }
  .wrap{ display:flex; flex-direction:column; align-items:center; gap:clamp(14px,3.4vw,20px); width:var(--cardw); }

  /* ---- FLIP ---- */
  .flip{ width:100%; aspect-ratio:var(--ar); perspective:1500px; }
  .flip__inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.22,.61,.36,1); }
  .flip.is-flipped .flip__inner{ transform:rotateY(180deg); }
  .face{ position:absolute; inset:0; border-radius:0; box-shadow:var(--shadow); overflow:hidden; backface-visibility:hidden; -webkit-backface-visibility:hidden; }
  .flip:not(.is-flipped) .back{ pointer-events:none; }
  .flip.is-flipped .front{ pointer-events:none; }

  /* front */
  .front{ background:var(--royal); display:grid; place-items:center; padding:clamp(26px,8%,44px); cursor:pointer; }
  .front .logo{ width:72%; max-width:300px; height:auto; display:block; }
  .front:focus-visible{ outline:3px solid var(--royal-ink); outline-offset:-3px; }

  /* back */
  .back{ background:var(--paper); color:var(--ink); transform:rotateY(180deg); padding:clamp(18px,5.2%,26px); display:flex; flex-direction:column; align-items:flex-start; gap:clamp(9px,2.6%,14px); }
  .blk{ display:flex; flex-direction:column; line-height:1.35; }
  .nm{ font-size:clamp(16px,4.4vw,19px); font-weight:700; letter-spacing:.005em; }
  .rl{ font-size:clamp(13px,3.6vw,15px); font-weight:700; }
  .loc{ font-size:clamp(13px,3.6vw,15px); font-weight:400; }

  .contact{ display:flex; flex-direction:column; padding-left:clamp(24px,9%,42px); line-height:1.4; }
  .ln{ font-size:clamp(13px,3.6vw,15px); font-weight:400; color:var(--ink); text-decoration:none; width:fit-content; max-width:100%; position:relative; padding:1px 0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ln::after{ content:""; position:absolute; left:0; right:100%; bottom:1px; height:1.5px; background:var(--ink); transition:right .16s ease; }
  .ln:hover::after, .ln:focus-visible::after{ right:0; }
  .ln:focus-visible{ outline:none; }

  .nav{ align-self:flex-end; margin-top:auto; display:flex; flex-direction:column; align-items:flex-end; line-height:1.3; }
  .nav a{ font-size:clamp(13px,3.6vw,15px); font-weight:700; color:var(--ink); text-decoration:none; position:relative; padding:1px 0; }
  .nav a::after{ content:""; position:absolute; right:0; left:100%; bottom:1px; height:1.5px; background:var(--ink); transition:left .16s ease; }
  .nav a:hover::after, .nav a:focus-visible::after{ left:0; }
  .nav a:focus-visible{ outline:none; }

  /* flip label */
  .fliplabel{ background:none; border:0; color:var(--ground-fg); font-family:var(--sans); font-size:12px; letter-spacing:.1em; text-transform:uppercase; font-weight:600; cursor:pointer; opacity:.65; padding:5px 6px; transition:opacity .15s ease; }
  .fliplabel:hover, .fliplabel:focus-visible{ opacity:1; }
  .fliplabel:focus-visible{ outline:1px solid currentColor; outline-offset:3px; }

  .theme{
    position:fixed; top:env(safe-area-inset-top,0px); right:0;
    margin:12px; margin-right:max(12px,env(safe-area-inset-right,0px));
    width:34px; height:34px; border-radius:50%;
    border:1px solid currentColor; background:transparent; color:var(--ground-fg);
    opacity:.5; cursor:pointer; font-size:14px; line-height:1; display:grid; place-items:center; transition:opacity .15s ease;
  }
  .theme:hover{ opacity:1; }

  @media (prefers-reduced-motion:reduce){ .flip__inner, .ln::after, .nav a::after{ transition:none } }
</style>
</head>

<script>
  (function(){
    var root=document.documentElement, btn=document.getElementById('theme');
    var saved; try{ saved=localStorage.getItem('adriel-theme'); }catch(e){}
    if(saved){ root.setAttribute('data-theme',saved); }
    btn.addEventListener('click',function(){
      var cur=root.getAttribute('data-theme');
      var isDark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme:dark)').matches;
      var next = isDark ? 'light' : 'dark';
      root.setAttribute('data-theme',next);
      try{ localStorage.setItem('adriel-theme',next); }catch(e){}
    });

    var flip=document.getElementById('flip'), label=document.getElementById('fliplabel'), front=document.getElementById('frontFace');
    function set(f){
      flip.classList.toggle('is-flipped', f);
      label.textContent = f ? '← flip back' : 'click to flip →';
      front.setAttribute('aria-pressed', f ? 'true':'false');
    }
    label.addEventListener('click', function(){ set(!flip.classList.contains('is-flipped')); });
    front.addEventListener('click', function(){ set(true); });
    front.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); set(true); } });
  })();
</script>
